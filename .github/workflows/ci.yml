name: Test, build and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Deployment target: test is your server; prod is your friend server'
        type: choice
        options: [test, prod]
        default: test
      prepare_only:
        description: 'First install: only deliver and pull images; initialize library and panel before live deployment'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Legacy web checks with sanitizer
        run: |
          npm install --prefix "$RUNNER_TEMP/c156-web" --no-save jsdom@26.1.0
          C156_JSDOM_PATH="$RUNNER_TEMP/c156-web/node_modules/jsdom" node --test tests/web/*.test.mjs
      - run: npm ci && npm test && npm run typecheck && npm run build
        working-directory: frontend
      - run: bash -n deploy/*.sh
  images:
    needs: checks
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build final images once
        env: {BUILD_SHA: '${{ github.sha }}'}
        run: |
          docker buildx build --platform linux/amd64 --load --provenance=false --sbom=false --build-arg BUILD_SHA="$BUILD_SHA" -f deploy/backend.Dockerfile -t "c156-backend:$BUILD_SHA" .
          docker buildx build --platform linux/amd64 --load --provenance=false --sbom=false --build-arg BUILD_SHA="$BUILD_SHA" -f deploy/frontend.Dockerfile -t "c156-frontend:$BUILD_SHA" .
      - name: Test actual final images and restart persistence
        env:
          BUILD_SHA: ${{ github.sha }}
          BACKEND_IMAGE: c156-backend:${{ github.sha }}
          FRONTEND_IMAGE: c156-frontend:${{ github.sha }}
        run: python3 deploy/smoke.py
      - name: Save the tested images for the deployment job
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env: {BUILD_SHA: '${{ github.sha }}'}
        run: |
          mkdir -p "$RUNNER_TEMP/c156-images"
          docker save "c156-backend:$BUILD_SHA" "c156-frontend:$BUILD_SHA" -o "$RUNNER_TEMP/c156-images/images.tar"
          cd "$RUNNER_TEMP/c156-images"
          sha256sum images.tar > images.sha256
      - name: Upload tested images
        id: upload
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c156-images-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c156-images/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
  deploy:
    needs: images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: Publish and deploy (${{ inputs.target_environment || 'test' }})
    concurrency:
      group: c156-${{ inputs.target_environment || 'test' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check selected repository configuration
        id: config
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment || 'test' }}
          DEPLOY_ENABLED: ${{ vars[format('{0}_DEPLOY_ENABLED', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] }}
          ACR_REGISTRY: ${{ vars[format('{0}_ACR_REGISTRY', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] }}
          ACR_NAMESPACE: ${{ vars[format('{0}_ACR_NAMESPACE', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] }}
          ACR_USERNAME: ${{ secrets[format('{0}_ACR_USERNAME', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] }}
          ACR_PASSWORD: ${{ secrets[format('{0}_ACR_PASSWORD', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] }}
          DEPLOY_HOST: ${{ secrets[format('{0}_DEPLOY_HOST', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] }}
          DEPLOY_USER: ${{ vars[format('{0}_DEPLOY_USER', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] }}
          SSH_KEY: ${{ secrets[format('{0}_DEPLOY_SSH_KEY', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] }}
          KNOWN_HOSTS: ${{ secrets[format('{0}_DEPLOY_KNOWN_HOSTS', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] }}
        run: |
          set -euo pipefail
          [[ "$TARGET_ENVIRONMENT" == test || "$TARGET_ENVIRONMENT" == prod ]]
          prefix=TEST
          if [[ "$TARGET_ENVIRONMENT" == prod ]]; then prefix=PROD; fi
          if [[ "$DEPLOY_ENABLED" != true ]]; then
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              printf 'Deployment disabled: set %s_DEPLOY_ENABLED=true in Repository Variables.\n' "$prefix" >&2
              exit 1
            fi
            printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
            printf 'Target %s is not enabled; no images pushed or server changed.\n' "$TARGET_ENVIRONMENT"
            exit 0
          fi
          for key in ACR_REGISTRY ACR_NAMESPACE ACR_USERNAME ACR_PASSWORD DEPLOY_HOST DEPLOY_USER SSH_KEY KNOWN_HOSTS; do
            case $key in
              SSH_KEY) suffix=DEPLOY_SSH_KEY ;;
              KNOWN_HOSTS) suffix=DEPLOY_KNOWN_HOSTS ;;
              *) suffix=$key ;;
            esac
            [[ -n "${!key}" ]] || { printf 'Missing Repository parameter: %s_%s\n' "$prefix" "$suffix" >&2; exit 1; }
          done
          printf 'enabled=true\n' >> "$GITHUB_OUTPUT"
      - name: Download tested images from this run
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.images.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/c156-images
      - name: Verify and load the tested images
        if: steps.config.outputs.enabled == 'true'
        env: {BUILD_SHA: '${{ github.sha }}'}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/c156-images"
          sha256sum -c images.sha256
          docker load -i images.tar
          for service in backend frontend; do
            revision=$(docker image inspect "c156-$service:$BUILD_SHA" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            [[ "$revision" == "$BUILD_SHA" ]]
          done
      - name: Log in to existing ACR personal registry
        if: steps.config.outputs.enabled == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars[format('{0}_ACR_REGISTRY', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] }}
          username: ${{ secrets[format('{0}_ACR_USERNAME', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] }}
          password: ${{ secrets[format('{0}_ACR_PASSWORD', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] }}
      - name: Push the tested images, keep immutable digest references
        id: publish
        if: steps.config.outputs.enabled == 'true'
        env:
          BUILD_SHA: ${{ github.sha }}
          ACR_REGISTRY: ${{ vars[format('{0}_ACR_REGISTRY', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] }}
          ACR_NAMESPACE: ${{ vars[format('{0}_ACR_NAMESPACE', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] }}
        run: |
          set -euo pipefail
          for service in backend frontend; do
            image="$ACR_REGISTRY/$ACR_NAMESPACE/c156-$service:$BUILD_SHA"
            docker tag "c156-$service:$BUILD_SHA" "$image"
            docker push "$image"
            digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
            [[ "$digest" == "$ACR_REGISTRY/$ACR_NAMESPACE/c156-$service@sha256:"* ]]
            printf '%s=%s\n' "$service" "$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Package and deliver the same commit
        if: steps.config.outputs.enabled == 'true'
        env:
          BACKEND_IMAGE: ${{ steps.publish.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.publish.outputs.frontend }}
          DEPLOY_HOST: ${{ secrets[format('{0}_DEPLOY_HOST', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] }}
          DEPLOY_PORT: ${{ vars[format('{0}_DEPLOY_PORT', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] || '22' }}
          DEPLOY_USER: ${{ vars[format('{0}_DEPLOY_USER', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] }}
          DEPLOY_ROOT: ${{ vars[format('{0}_DEPLOY_ROOT', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] || '/srv/c156' }}
          SSH_KEY: ${{ secrets[format('{0}_DEPLOY_SSH_KEY', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] }}
          KNOWN_HOSTS: ${{ secrets[format('{0}_DEPLOY_KNOWN_HOSTS', inputs.target_environment == 'prod' && 'PROD' || 'TEST')] }}
          SHA: ${{ github.sha }}
          SEQUENCE: ${{ github.run_number }}
          ATTEMPT: ${{ github.run_attempt }}
          PREPARE_ONLY: ${{ inputs.prepare_only }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ && "$DEPLOY_ROOT" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEPLOY_ROOT" != / && "$DEPLOY_ROOT" != *'/../'* ]]
          bash deploy/package.sh "$RUNNER_TEMP/release" "$SHA" "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$SEQUENCE"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_c156"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_c156" "$HOME/.ssh/known_hosts"
          ssh_options=(-i "$HOME/.ssh/id_c156" -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          [[ "$ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          destination="$DEPLOY_ROOT/releases/$SEQUENCE-$ATTEMPT-$SHA"
          # Paths are validated above and intentionally expanded on the runner.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir '$destination'"
          rsync -az -e "ssh -i $HOME/.ssh/id_c156 -p $DEPLOY_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes" "$RUNNER_TEMP/release/" "$DEPLOY_USER@$DEPLOY_HOST:$destination/"
          deploy_args=
          [[ "$PREPARE_ONLY" != true ]] || deploy_args=--prepare
          # Paths are validated above and intentionally expanded on the runner.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash '$destination/deploy.sh' '$DEPLOY_ROOT' '$destination' $deploy_args"
          rm -f "$HOME/.ssh/id_c156"
